<div class="wrapper qikaa">
  <div class="line"></div>
  <div
    class="icon-container"
    [style.transform]="'rotate(' + rotationDegree + 'deg)'"
  >
    <img
      [style.transform]="'rotate(-' + rotationDegree + 'deg)'"
      class="line-icon"
      src="../../../../assets/img/rivals-logo-mini.png"
      alt=""
    />
  </div>
  <div class="line2"></div>
  <div class="cards-container">
    <app-story-card
      (click)="onCardClick(card)"
      class="story-card"
      *ngFor="let card of fetchedCards$ | async"
      [card]="card"
    ></app-story-card>
  </div>
</div>
