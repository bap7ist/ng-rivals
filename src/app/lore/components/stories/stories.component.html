<div class="wrapper qikaa">
  @if (!(isMobile$ | async)) {
    <div class="line"></div>
    <div
      class="icon-container"
      [style.transform]="'rotate(' + rotationDegree + 'deg)'">
      <img
        [style.transform]="'rotate(-' + rotationDegree + 'deg)'"
        class="line-icon"
        src="../../../../assets/img/rivals-logo-mini.png"
        alt="" />
    </div>

    <div class="line2"></div>
  }
  <div class="cards-container">
    @for (card of fetchedCards$ | async; track card) {
      @if (card.type) {
        <app-story-card
          id="{{ card.id }}"
          (click)="
            card.type !== 'Videos'
              ? onCardClick(card)
              : openModal(videoModal, card.id)
          "
          class="story-card"
          [ngClass]="{ main: card.id === 0 }"
          [card]="card"
          [isMobile]="isMobile$ | async"></app-story-card>
      }
    }
  </div>
</div>

<ng-template #videoModal>
  <app-video-modal></app-video-modal>
</ng-template>
<app-footer></app-footer>
