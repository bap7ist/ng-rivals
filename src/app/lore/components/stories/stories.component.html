<div class="wrapper qikaa">
  <ng-container *ngIf="!(isMobile$ | async)">
    <div class="line"></div>
    <div
      class="icon-container"
      [style.transform]="'rotate(' + rotationDegree + 'deg)'"
    >
      <img
        [style.transform]="'rotate(-' + rotationDegree + 'deg)'"
        class="line-icon"
        src="../../../../assets/img/rivals-logo-mini.png"
        alt=""
      />
    </div>

    <div class="line2"></div>
  </ng-container>
  <div class="cards-container">
    <app-story-card
      (click)="card.type !== 'Videos' ? onCardClick(card) : openModal(videoModal, card.id)"
      class="story-card"
      *ngFor="let card of fetchedCards$ | async"
      [card]="card"
      [isMobile]="isMobile$ | async"
    ></app-story-card>
  </div>
</div>

<ng-template #videoModal>
  <app-video-modal></app-video-modal>
</ng-template>
