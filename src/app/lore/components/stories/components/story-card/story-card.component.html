<div class="card qikaa">
  <div class="inside">
    <img
      src="../../../../../../assets/img/lore/{{card.img}}.jpg"
      class="image"
    />
    <div class="footer">
      <div class="text">
        <h2>{{ card.type }}</h2>
        <h1 [innerHTML]="card.title"></h1>
        <p *ngIf="!isMobile">{{ card.description }}</p>
        <p *ngIf="isMobile">{{ card.description | truncate: 30 }}</p>
      </div>
    </div>
  </div>
</div>
