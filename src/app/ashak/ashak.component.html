@let selectedAshak = selectedAshak$ | async;

<div [ngClass]="{'center' : selectedAshak === 'home'}" class="title qikaa">
  @if (selectedAshak !== 'home') {
    <div (click)="onRetourClick()" class="retour">
      <img src="../../assets/img/logos/retour.png" alt="" />
    </div>
  } @else {
    <h1>Choisis ton Ashak</h1>
  }
</div>
<router-outlet></router-outlet>
