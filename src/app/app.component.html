@if (isLoading) {
  <app-loader @fadeOut></app-loader>
}
@if (showNavbar) {
  <app-navbar
    [url$]="currentURLSubject"
    [isMobile]="isMobile$ | async"
    [ashak]="ashak$ | async"
    (sidePanelOn)="showPanel = !showPanel" />
}
@if (showPanel) {
  <app-side-panel
    @slideInTopFast
    [isMobile]="isMobile$ | async"
    [ashak]="ashak$ | async"
    (closePanel)="showPanel = false" />
    <div
    @fadeInOutFast
    (click)="showPanel = !showPanel"
    class="back-panel-container"></div>

  

 
}
