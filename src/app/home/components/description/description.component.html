<div class="description-container {{ ashak }}">
  <div class="fake-header"></div>
  <ng-container *ngIf="!isMobile">
    <div class="smalltext-container">
      <h1 class="boardgame-text">
        {{ "home.boardgame.game" | translate | uppercase }}
      </h1>
    </div>
    <div verticalParallax [factorY]="1" class="left-line"></div>
    <div verticalParallax [factorY]="1" class="square"></div>

    <div class="text-container">
      <h1>{{ "home.boardgame.title" | translate | uppercase }}</h1>
      <div class="lines-container">
        <div *ngFor="let line of lines" class="line-container">
          <p>{{ line.text | translate }}</p>
          <img src="../../../../assets/img/logos/{{ line.img }}.png" alt="" />
        </div>
      </div>
      <app-button
        (click)="goToGameplay()"
        [width]="200"
        [innerWidth]="190"
        [height]="60"
        [innerHeight]="50"
        [name]="'home.boardgame.button'"
      ></app-button>
    </div>

    <div verticalParallax [factorY]="1" class="drone-container">
      <img
        class="drone"
        [ngStyle]="{
          transform: 'translateX(' + translateX + 'px)'
        }"
        src="../../../../assets/img/backgrounds/map_intro_2.png"
        alt=""
      />
      <img
        class="drone drone-light"
        [ngStyle]="{
          opacity: increaseOpacity,
          transform: 'translateX(' + translateX + 'px)'
        }"
        src="../../../../assets/img/backgrounds/map_intro_1.png"
        alt=""
      />
    </div>

    <img
      verticalParallax
      [factorY]="4"
      class="background"
      src=".././../../../assets/img/backgrounds/fond-planet.png"
      alt=""
    />
  </ng-container>
  <ng-container *ngIf="isMobile">
    <h1 class="boardgame-text">
      {{ "home.description.game" | translate | uppercase }}
    </h1>
    <div class="perpendicular"></div>
    <div class="left-line"></div>
    <div class="square"></div>
    <div class="text-container">
      <h1>{{ "home.description.title" | translate | uppercase }}</h1>
      <p>{{ "home.description.texte" | translate }}</p>
      <app-button
        (click)="goToGameplay()"
        [width]="200"
        [innerWidth]="190"
        [height]="60"
        [innerHeight]="50"
        [name]="'home.boardgame.button'"
      ></app-button>
    </div>
  </ng-container>
  <div class="fake-footer"></div>
</div>
