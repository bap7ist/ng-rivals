<div class="description-container {{ ashak }}">
  <div class="fake-header"></div>
  <h1 class="lore-text">{{ "lore" | uppercase }}</h1>
  <div verticalParallax [factorY]="1" class="left-line"></div>
  <div verticalParallax [factorY]="1" class="square"></div>
  <div class="text-container">
    <h1>{{ "home.description.title" | translate | uppercase }}</h1>
    <p>{{ "home.description.texte" | translate }}</p>
    <p>{{ "home.description.texte2" | translate }}</p>
    <p>{{ "home.description.texte3" | translate }}</p>
    <app-button
      [width]="200"
      [innerWidth]="190"
      [height]="60"
      [innerHeight]="50"
      [name]="'home.description.ashak.button'"
    ></app-button>
  </div>
  <div verticalParallax [factorY]="1" class="drone-container">
    <img
      class="drone"
      [ngStyle]="{ transform: 'translateX(' + translateX + 'px)' }"
      src="../../../../assets/img/drone-violet.png"
      alt=""
    />
    <img
      class="drone drone-light"
      [ngStyle]="{
        opacity: opacity,
        transform: 'translateX(' + translateX + 'px)'
      }"
      src="../../../../assets/img/drone-violet_light.png"
      alt=""
    />
  </div>

  <img
    verticalParallax
    [factorY]="4"
    class="background"
    src=".././../../../assets/img/backgrounds/fond-planet.png"
    alt=""
  />
  <div class="fake-footer"></div>
</div>
