<ng-container *ngIf="!isMobile">
  <div #cardsContainer class="cards-container {{ ashak }}">
    <div class="left-line"></div>
    <div
      width
      [factor]="3.2"
      [originalWidth]="-310"
      [maxWidth]="100"
      [ngClass]="{
        'stick-top':
          (scroll$ | async) > 2.2 * viewHeight &&
          (scroll$ | async) < 7.05 * viewHeight
      }"
      class="perpendicular"
    ></div>
    <h1
      horizontalParallax
      [factorX]="3.2"
      [maxHorizon]="420"
      [ngClass]="{
        'set-left': (scroll$ | async) > 0.7 * viewHeight,
        'stick-top':
          (scroll$ | async) > 2.2 * viewHeight &&
          (scroll$ | async) < 7.05 * viewHeight
      }"
      [ngStyle]="{ opacity: opacity }"
      class="gameplay-title"
    >
      GAMEPLAY
    </h1>
    <img
      [ngClass]="{
        'set-left': (scroll$ | async) > 0.7 * viewHeight,
        'stick-top':
          (scroll$ | async) > 2.2 * viewHeight &&
          (scroll$ | async) < 7.05 * viewHeight
      }"
      horizontalParallax
      [factorX]="3.2"
      [maxHorizon]="500"
      class="rivals-mini-logo"
      src="../../../../assets/img/rivals-logo-contour.png"
      alt=""
    />
    <div
      *ngIf="(scroll$ | async) > 1.3 * viewHeight"
      class="gameplay-container"
      [ngClass]="{
        'gameplay-show':
          (scroll$ | async) > 2.25 * viewHeight &&
          (scroll$ | async) < 6.14 * viewHeight,
        release: (scroll$ | async) >= 6.14 * viewHeight,
        opacity: (scroll$ | async) > 6.7 * viewHeight
      }"
    >
      <div class="circle-container">
        <img
          class="circle circle-logos-inner"
          src="../../../../assets/img/logos_circle.png"
          alt=""
        />
        <img
          [@rotate]="rotateState"
          class="circle-logos blinking"
          src="../../../../assets/img/logos_circle_logos.png"
          alt=""
        />
        <img
          @slideInLeft
          [ngClass]="{ reduce: (scroll$ | async) > 2.3 * viewHeight }"
          *ngIf="(scroll$ | async) > 2.14 * viewHeight"
          class="logo-left"
          src="../../../../assets/img/rivals_logo_gameplay_left.png"
          alt=""
        />
        <img
          @slideInRight
          [ngClass]="{ reduce: (scroll$ | async) > 2.3 * viewHeight }"
          *ngIf="(scroll$ | async) > 2.14 * viewHeight"
          class="logo-right"
          src="../../../../assets/img/rivals_logo_gameplay_right.png"
          alt=""
        />
        <div
          (click)="(rotateState)"
          *ngIf="(scroll$ | async) > 2.3 * viewHeight"
          @fadeInOut
          class="card"
        >
          <img
            @fadeInOut
            *ngIf="(scroll$ | async) > 2.38 * viewHeight"
            src="../../../../assets/img/dos_CARTES.png"
            alt=""
          />
        </div>
      </div>

      <ng-container *ngFor="let card of cards">
        <div
          @fadeInOut
          *ngIf="(scroll$ | async) > card.ngIf"
          horizontalParallax
          [factorX]="-3"
          [maxHorizonMinus]="card.maxHorizonMinus"
          class="card-2 minus-right-{{ card.right }}"
        >
          <div
            class="inner-card-container"
            [ngClass]="{ 'rotate-y-card': (scroll$ | async) > card.flip }"
          >
            <div class="front">
              <img
                src="../../../../assets/img/cards/{{ card.url }}.png"
                alt=""
              />
            </div>
            <div class="back">
              <img src="../../../../assets/img/dos_CARTES_2.png" alt="" />
            </div>
          </div>
        </div>
      </ng-container>
      <div class="text-container">
        <h1 @slideInLeft *ngIf="(scroll$ | async) > 1.7 * viewHeight">
          Deckbuilding
        </h1>
        <p @slideInLeft *ngIf="(scroll$ | async) > 2 * viewHeight">
          {{
            (scroll$ | async) > 6.5 * viewHeight
              ? ("home.gameplay.battleroyale.description" | translate)
              : ("home.gameplay.deckbuilding.description" | translate)
          }}
        </p>
      </div>
    </div>
  </div>
</ng-container>
