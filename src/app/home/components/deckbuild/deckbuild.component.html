<div class="deck-container qikaa">
  <div class="left-line"></div>
  <div class="title-section">
    <div class="gameplay-line-container">
      <div class="gameplay-line"></div>
      <h1>GAMEPLAY</h1>
      <img
        class="rivals-mini-logo"
        src="../../../../assets/img/rivals-logo-contour.png"
        alt="" />
    </div>

    <h1 class="main-title">DECKBUILDING</h1>
  </div>

  <div class="cards-hand">
    @for (card of cards; track card.id) {
      <div class="card" 
           [style.transform]="getCardTransform(card.id)"
           class="card">
        <div class="card-inner" [@cardFlip]="cardState">
          <div class="card-front">
            <img [src]="card.image" [alt]="card.name" class="card-image">
          </div>
          <div class="card-back">
            <img [src]="cardBackImage" alt="Card back" class="card-image">
          </div>
        </div>
      </div>
    }
  </div>

  <div class="card-types">
    <div (click)="goToCards('base')" class="badge">
      <img src="../../../../assets/icons/card_interface.png" alt="" />
      <p>47 cartes de Base</p>
    </div>
    <div (click)="goToCards('guilde')" class="badge">
      <img src="../../../../assets/icons/card_guild.png" alt="" />
      <p>12 cartes Guilde</p>
    </div>
    <div (click)="goToCards('schema')" class="badge">
      <img src="../../../../assets/icons/card_interface.png" alt="" />
      <p>24 cartes Schémas</p>
    </div>
    <div (click)="goToCards('zone')" class="badge">
      <img src="../../../../assets/icons/card_zone.png" alt="" />
      <p>18 cartes Zone</p>
    </div>
    <div (click)="goToCards('interface')" class="badge">
      <img src="../../../../assets/icons/card_interface.png" alt="" />
      <p>138 cartes Interface</p>
    </div>
    <div (click)="goToCards('evenement')" class="badge">
      <img src="../../../../assets/icons/card_event.png" alt="" />
      <p>20 cartes Événements</p>
    </div>
  </div>

  <div class="buttons">
    <!-- <app-button
      (click)="goToCards()"
      [width]="200"
      [innerWidth]="190"
      [height]="60"
      [innerHeight]="50"
      [name]="'Découvez les cartes'"></app-button> -->
      <app-button-2>Découvrir les cartes</app-button-2>
    <p>ou</p>
    <div (click)="pioche()"   class="pioche-wrapper">
      <img src="../../../../assets/img/logos/pioche_white.png" alt="" />
    </div>
  </div>

  <div class="triangle"></div>
  <div class="super-line"></div>
</div>
