<div class="landing {{ ashak }}" id="landing">
  <!-- DESKTOP -->
  <ng-container *ngIf="!isMobile">
    <div class="left-side-bar"></div>
    <div class="left-bottom-corner"></div>
    <div class="behind">
      <ng-container *ngIf="showEasterEgg">
        <img
          class="mantaship"
          src="../../../../assets/img/backgrounds/qikaa-mantaship.jpg"
          alt=""
        />
        <div class="manta-texte">
          <h1>
            Jour 1. / Navigation autonome. / Direction - Kuna. / E.T.A - 7
            jours.
          </h1>
         
        </div>
      </ng-container>
      <img
        *ngIf="!showEasterEgg"
        src="../../../../assets/img/logos/rivals-logo-filled-orange.png"
        alt=""
      />
    </div>
    <div @slideInLeftFastAndSlow class="left-panel" *ngIf="!showEasterEgg">
      <div verticalParallax [factorY]="2" class="title-container">
        <div verticalParallax [factorY]="1" class="rivals">
          <img
            src="../../../../assets/img/rivals_logo_{{ ashak }}.png"
            alt=""
          />
        </div>
        <div class="subtitle">
          <h1>{{ "home.subtitle" | translate | uppercase }}</h1>
        </div>
        <div class="description">
          <p>{{ "home.intro.desktop" | translate }}</p>
        </div>
        <div *ngIf="!showSocialNetworks" class="buttons-container">
          <app-button [name]="'kickstarter'"></app-button>
          <p>{{ "home.or" | translate | uppercase }}</p>
          <app-button
            (click)="showSocialNetworks = true"
            [name]="'home.follow.us'"
          ></app-button>
        </div>
        <div *ngIf="showSocialNetworks" class="logos-container">
          <a
            href="{{ network.link }}"
            target="_blank"
            *ngFor="let network of socialNetworks"
            class="logo"
          >
            <img
              src="../../../../assets/img/logos/{{
                network.name
              }}-logo-round-orange.png"
              alt=""
            />
          </a>
        </div>
      </div>
      <img
        class="trigone"
        src="../../../../assets/img/trigones_{{ ashak }}.png"
        alt=""
      />
    </div>
    <div @slideInRightFastAndSlow class="right-panel" *ngIf="!showEasterEgg"></div>
    <ng-container *ngIf="!showEasterEgg">
      <img
        @slideInRightSlow
        (click)="showEasterEgg = true"
        verticalParallax
        [factorY]="2"
        class="ashak-gif"
        src="../../../../assets/img/gif_{{ ashak }}.gif"
        alt=""
      />
      <img
        @slideInRightSlow
        verticalParallax
        [factorY]="-2"
        class="sun"
        src="../../../../assets/img/sun.png"
        alt=""
      />
    </ng-container>
  </ng-container>

  <!-- MOBILE -->
  <ng-container *ngIf="isMobile">
    <img
      class="qikaa-mobile"
      src="../../../../assets/img/qikaa_scream.png"
      alt=""
    />
    <div class="left-bottom-corner"></div>
    <img
      class="trigone"
      src="../../../../assets/img/trigones_{{ ashak }}.png"
      alt=""
    />
    <div verticalParallax [factorY]="2" class="title-container">
      <div verticalParallax [factorY]="1" class="rivals">
        <img src="../../../../assets/img/rivals_logo_{{ ashak }}.png" alt="" />
      </div>
      <div class="subtitle">
        <h1>{{ "home.subtitle" | translate | uppercase }}</h1>
      </div>
      <div class="description">
        <p>{{ "home.intro.mobile" | translate }}</p>
      </div>
      <div class="buttons-container">
        <app-button [name]="'home.follow.us'"></app-button>
      </div>
    </div>
  </ng-container>
</div>
