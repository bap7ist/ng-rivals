<div class="battle-container qikaa">
  <div class="right-line"></div>
  <div class="logo-container">
    <img
      class="logo-rivals"
      src="../../../../assets/img/logos/logo_rivals_dark_rotated.png"
      alt="" />
  </div>

  <div class="text-container" #textContainer>
    <h1 [innerHTML]="'home.description.title' | translate"></h1>
    <p [class.typewriter]="isTyping" [innerHTML]="displayText"></p>
    @if (!isTyping) {
      <app-button
        @fadeInUp
        [width]="200"
        [innerWidth]="190"
        [height]="60"
        [innerHeight]="50"
        [name]="'Découvrez les Ashaks'"></app-button>
    }
  </div>
  <img
    class="mask-image-top"
    src="../../../../assets/img/backgrounds/fille_desert_2.png"
    alt="" />

  <div class="fille-desert">
    <img
      class="mask-image"
      src="../../../../assets/img/backgrounds/fille_desert.png"
      alt="Fille Desert" />
    <img
      class="content-image"
      src="../../../../assets/img/backgrounds/desert.jpg"
      alt="Image masquée" />
  </div>
</div>
