<div class="video-modal-overlay qikaa" (click)="close()">
  <div class="video-modal-container">
    <div class="video-modal-content">
      <iframe
        *ngIf="id === 0"
        width="800"
        height="452"
        src="https://www.youtube.com/embed/mqMYpAuxqbk?autoplay=1"
        title="Rivals | Trailer"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen
      ></iframe>
      <iframe
        *ngIf="id === 13"
        width="800"
        height="452"
        src="https://www.youtube.com/embed/uZSXfiqPfbY?autoplay=1"
        title="YouTube video player"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen
      ></iframe>
    </div>
  </div>
</div>
