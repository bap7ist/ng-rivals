<div class="footer {{ ashak$ | async }}">
  <div class="socials">
    <a
      href="{{ social.url }}"
      target="_blank"
      *ngFor="let social of socials"
      class="social"
    >
      <img
        src="../../../../assets/img/logos/{{
          social.name
        }}-logo-round-white.png"
        alt=""
      />
    </a>
  </div>
  <h1 class="copyright">© 2022 Unkind Games, RIVALS <small>sont des marques déposées Unkind Games.</small></h1>
  <img class="unkind" src="../../../../assets/img/logo_unkind_white.png" alt="">
</div>
